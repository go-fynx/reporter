syntax = "proto3";

package reporter.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/go-fynx/reporter/reporter-go/proto/reporter/v1;reporterv1";

// ReporterService receives log and error events from applications.
//
// Go services call it over gRPC through the reporter-go SDK. Services in other
// languages can POST JSON to /reporter.v1.ReporterService/Notify.
service ReporterService {
  // Notify submits one or more events. The call succeeds when every accepted
  // event has been stored; invalid events are listed in the response and are
  // never stored.
  rpc Notify(NotifyRequest) returns (NotifyResponse);
}

enum Severity {
  // Always rejected.
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1;
  SEVERITY_WARNING = 2;
  SEVERITY_ERROR = 3;
}

message NotifyRequest {
  // Describes the process that produced every event in this request.
  Source source = 1;
  repeated Event events = 2;
}

message Source {
  // Name of the reporting service, for example "booking-api". Required.
  string service = 1;
  // For example "production" or "staging". Defaults to "production".
  string environment = 2;
  string app_version = 3;
  string hostname = 4;
  string os = 5;
  string runtime_version = 6;
  string sdk_name = 7;
  string sdk_version = 8;
}

message Event {
  // UUID generated by the client when the event is captured. Sending the same
  // event_id again for the same project does not store a second copy.
  string event_id = 1;
  // When the event happened, according to the client's clock.
  google.protobuf.Timestamp timestamp = 2;
  Severity severity = 3;
  // True when the event comes from a panic or crash nobody recovered.
  bool unhandled = 4;
  string message = 5;
  // Type of the reported error, for example "*fs.PathError". At least one of
  // message and error_type must be set.
  string error_type = 6;
  // Innermost call first.
  repeated StackFrame stack = 7;
  // Errors wrapped inside the reported error, outermost first.
  repeated Cause causes = 8;
  map<string, AttributeValue> attributes = 9;
}

message StackFrame {
  string function = 1;
  string file = 2;
  int32 line = 3;
  bool in_project = 4;
}

message Cause {
  string error_type = 1;
  string message = 2;
  repeated StackFrame stack = 3;
}

message AttributeValue {
  oneof kind {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
  }
}

message NotifyResponse {
  int32 accepted_count = 1;
  repeated Rejection rejections = 2;
}

// Rejection explains why one event was not stored. Rejected events must not be
// sent again unchanged.
message Rejection {
  // Position of the event in NotifyRequest.events, starting at 0.
  int32 index = 1;
  string event_id = 2;
  RejectionReason reason = 3;
  string detail = 4;
}

enum RejectionReason {
  REJECTION_REASON_UNSPECIFIED = 0;
  REJECTION_REASON_INVALID_EVENT_ID = 1;
  REJECTION_REASON_DUPLICATE_EVENT_ID = 2;
  REJECTION_REASON_INVALID_TIMESTAMP = 3;
  REJECTION_REASON_INVALID_SEVERITY = 4;
  REJECTION_REASON_MISSING_MESSAGE = 5;
  REJECTION_REASON_INVALID_ATTRIBUTE = 6;
  REJECTION_REASON_TOO_MANY_ATTRIBUTES = 7;
  REJECTION_REASON_TOO_MANY_CAUSES = 8;
  REJECTION_REASON_TOO_MANY_FRAMES = 9;
}
